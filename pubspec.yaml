name: kaamwala
description: "Kaamwala - Home Services App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5

  # State Management
  flutter_riverpod: ^2.6.1

  # Image Picker (for profile photo)
  image_picker: ^1.1.2

  # HTTP (for Cloudinary upload)
  http: ^1.3.0

  # Date Formatting
  intl: ^0.20.2

  # AI Chatbot
  google_generative_ai: ^0.4.6

  # Maps & Location
  google_maps_flutter: ^2.9.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Persistence
  shared_preferences: ^2.3.4
  flutter_dotenv: ^6.0.1

  # URL Launcher (for maps navigation)
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"

  # Optional: For beautiful adaptive Android icons (Android 8.0+)
  adaptive_icon_background: "#FFFFFF"        # solid color
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

  # Or use image background
  # adaptive_icon_background: "assets/icon/background.png"

  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#00BCD4"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon/
    - .env
